# Copy to a private local file. Start with autoprob.GoTool <file> cmd=analysishandler.
cmd=analysishandler
baseurl=https://goproblems.example/
apikey=REPLACE_WITH_ADMIN_WORKER_API_KEY
clientId=REPLACE_WITH_STABLE_CLIENT_ID
analysis.types=scenario,joseki,review
analysis.poll.interval.ms=2000
# Receive queue changes via Mercure; heartbeat requests only renew the task lease.
analysis.use.mercure=true
auth.username=REPLACE_WITH_GOPROBLEMS_USERNAME
auth.password=REPLACE_WITH_GOPROBLEMS_PASSWORD
# Set these when the Mercure hub uses a different address from baseurl:
# mercure.baseurl=http://localhost:3000
# mercure.hub.url=/.well-known/mercure

# goproblems keeps scenario requests on the legacy queue by default.
# Opt in on the server with ANALYSIS_SCENARIO_QUEUE_ENABLED=1 when ready.
# Existing scenariohandler/josekihandler commands remain independent.

katago=/path/to/katago
kata.config=/path/to/analysis.cfg
kata.model=/path/to/model.bin.gz
# Required by human-like scenario analysis and optional joseki human-policy generation:
kata.human_model=/path/to/b18c384nbt-humanv0.bin.gz
kata.query.timeout.ms=120000
review.query.timeout.ms=120000
review.visits=500
scenario.request.timeout.ms=30000

# Optional legacy Josekipedia producer bridge. Keep existing JWT/base SGF settings.
analysis.joseki.bridge=false
joseki.baseurl=https://josekipedia.example/
analysis.joseki.namespace=josekipedia-production
# api.joseki.username=REPLACE_LOCALLY
# api.joseki.password=REPLACE_LOCALLY
# joseki.base_sgf=/path/to/joseki-base.sgf
joseki.analysis_scopes=local,local_with_moves,global
joseki.visits=1000

# If reusing an existing josekipedia.properties file, leave baseurl/apikey untouched
# and configure central credentials separately instead:
# analysis.baseurl=https://goproblems.example/
# analysis.apikey=REPLACE_WITH_ADMIN_WORKER_API_KEY
