# Copy this template to analysis-worker-tf3.properties or analysis-worker-all.properties.
# Use a distinct Client ID for each worker process.
# Models, task types, concurrency, GPU group, threads and analysis parameters come from the Client API.
# Set analysis parameter overrides in the Client admin form; omitted values use server defaults.
# Start with autoprob.GoTool <file> cmd=analysishandler.
cmd=analysishandler
baseurl=https://goproblems.example/
apikey=REPLACE_WITH_ADMIN_WORKER_API_KEY
clientId=REPLACE_WITH_STABLE_CLIENT_ID
katago=/path/to/katago
kata.config=/path/to/analysis.cfg
kata.models.dir=/path/to/models

# Optional when human weights live in a different directory:
# kata.human_models.dir=/path/to/human-models
# The API supplies the Mercure hub URL and a subscription token using this same API key.
# Override the hub address only when this machine needs a different route:
# mercure.baseurl=http://localhost:3000
# mercure.hub.url=/.well-known/mercure

# Resource monitoring (optional, Linux and Windows). These settings stay local.
# Set the same host.id on Clients running on the same physical machine.
# analysis.telemetry.enabled=true
# analysis.telemetry.host.id=t4-main
# analysis.telemetry.host.name=T4 server
# analysis.telemetry.active.interval.seconds=5
# analysis.telemetry.idle.interval.seconds=20
# analysis.telemetry.command.timeout.ms=2000
# analysis.telemetry.nvidia_smi=C:/Windows/System32/nvidia-smi.exe

# Optional local JSON collector commands, expressed as argv arrays, without a shell.
# They may override host/process fields and the gpus array. {pids} expands to the
# comma-separated Java + descendant PIDs. Prefer forward slashes in Windows paths.
# analysis.telemetry.command.linux=["/usr/local/bin/collect-analysis-metrics","--pids","{pids}"]
# analysis.telemetry.command.windows=["powershell.exe","-NoProfile","-NonInteractive","-File","C:/analysis/collect-metrics.ps1","-ProcessIds","{pids}"]
