# Lean analysis config for the redo/validation tool. Based on katago's
# analysis_example.cfg but sized down: this tool sends strictly sequential
# queries, and the b28 net plus the human model already have a large
# footprint, so a big nn cache and a second analysis thread only cause
# memory pressure (paging was stalling queries past the 300s timeout).
logDir = analysis_logs
reportAnalysisWinratesAs = BLACK
maxVisits = 500
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 14
nnRandomize = true
