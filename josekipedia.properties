debug=false

# baseurl=http://localhost:8081/
baseurl=https://staging.josekipedia.com/
katago=/opt/homebrew/bin/katago
kata.config=/opt/homebrew/Cellar/katago/1.16.3/share/katago/configs/analysis_example.cfg
# kata.model=/Users/baibonjwa/goproblems/katago/kata1-b28c512nbt-s7332806912-d4357057652.bin.gz
kata.model=/Users/baibonjwa/goproblems/katago/kata1-b15c192-s1672170752-d466197061.txt.gz
# kata.model=/Users/baibonjwa/goproblems/katago/kata1-b18c384nbt-s9996604416-d4316597426.bin.gz
kata.human_model=/Users/baibonjwa/goproblems/katago/b18c384nbt-humanv0.bin.gz

api.joseki.nodes=api/joseki-nodes
api.joseki.human_policy_tasks=api/joseki-human-policy-tasks
api.joseki.human_policy_progress=api/joseki-human-policy-tasks/progress
api.joseki.analysis_tasks=api/joseki-analysis-tasks
api.joseki.analysis_results=api/joseki-analysis-results
api.joseki.analysis_requests_next=api/joseki-analysis-requests/next
api.joseki.analysis_request_error=api/joseki-analysis-requests/{id}/error
api.joseki.analysis_requests=api/joseki-analysis-requests
api.joseki.node_completion_candidates=api/joseki-node-completion-candidates
api.joseki.login=api/auth/login
api.joseki.refresh=api/auth/refresh

# Required by cmd=josekihandler and when submitting any Joseki analysis result.
# The account must have ROLE_ADMIN in josekipedia.
# Do not commit the password.
api.joseki.username=baitianliang
api.joseki.password=11111111
# Analysis client UUID used for task targeting and result attribution.
# localhost
# clientId=8cebaacd-15a8-4692-88b6-a6252f11d517
# staging
clientId=8ecbed65-c399-421f-92d7-c164d32af378

######## katago settings
kata.debug_print=false
kata.print_analyzer_query=false
kata.print_summary_result=false
kata.query.timeout.ms=60000

######## joseki analysis settings
joseki.visits=100
joseki.komi=6.5
joseki.max_move_distance=4
# joseki.analysis_scopes=local
joseki.analysis_scopes=local,local_with_moves,global

# Human policy is calculated for 21 humanSL profiles by default: selected
# rank_* profiles (20k, 10k, 5k, 1d, 5d, 9d), selected preaz_* profiles
# (20k, 15k, 10k, 5k, 3k, 1k, 1d, 3d, 5d, 7d, 9d), and 4 representative
# pro years (1950, 1980, 2000, 2023).
# Override with a comma separated profile list to only fill a subset, e.g.:
# joseki.human_sl_profiles=rank_5k,rank_1d,proyear_2023
# Human policy queries use 1 visit and average over this many board symmetries.
# joseki.human_visits=1
# joseki.human_sl_symmetries=2
# Calculate a Human Policy node when its global policy reaches this threshold
# OR its normalized local policy reaches joseki.local_policy_threshold.
# Set the global threshold to 0 to disable Human Policy pruning.
# Set the local threshold to 0 to use only the global threshold.
joseki.low_policy_threshold=0.01
joseki.local_policy_threshold=0.05

joseki.completion.ai_policy_threshold=0.5
joseki.completion.human_policy_threshold=0.8
joseki.completion.max_move_distance=4
joseki.completion.max_path_depth=20
joseki.completion.page_limit=100
# Skip a parent when any move on its path has the system.low-policy tag.
joseki.completion.prune_low_policy_paths=true
# Candidate details are noisy on large scans; progress is always printed.
joseki.completion.print_candidates=false
# Set to true to estimate the number of requests without creating any.
# joseki.completion.dry_run=false

# joseki.api_max_attempts=20
# joseki.api_retry_delay_ms=5000

# Optional filters for focused recalculation.
sort=breadth
# path=
# pathPrefix=Q16,R17
# includeDeleted=true
