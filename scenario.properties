######## katago settings

katago=<katago-path>
kata.config=<kata-config-path>
kata.model=<kata-model-path>
kata.human_model=<kata-human-model-path>
apikey=<api-key>
# Authentication credentials for JWT token (used for Mercure)
auth.username=<username>
auth.password=<password>
# Client identification (UUID) — register with the server first
clientId=<clientId>

cmd=scenariohandler
debug=false
# baseurl=https://www.goproblems.com/
baseurl=https://staging.goproblems.com/
# baseurl=http://localhost/
api.problem.details=api/v2/problems/{id}
api.user.attempts=api/v2/attempts
api.analysis.requests.next=api/v2/analysis-requests/next
api.analysis.requests.submit=api/v2/scenarios/{scenarioId}/analysis-results
api.analysis.requests.error=api/v2/analysis-requests/{id}/error
api.analysis.clients.ping=api/v2/analysis-clients/{clientId}/ping
api.scenario_cases=api/v2/scenario-cases

# prints directly all text returned by katago
kata.debug_print=false
# prints query going in to katago from node analyzer
kata.print_analyzer_query=false
# prints one line summary of a query result
kata.print_summary_result=false
# KataGo query timeout in ms (0 = no timeout). Prevents client from hanging if KataGo stops responding.
kata.query.timeout.ms=60000
# Request-level timeout in ms (0 = no timeout). Limits total time for a single analysis request.
# Can be overridden per-scenario via configOverrides.timeoutSeconds from the API.
# scenario.request.timeout.ms=30000

######## scenario settings

######## Mercure SSE settings (alternative to polling)
# Set to true to use Mercure SSE instead of polling for analysis requests
scenario.use.mercure=true
# Mercure base URL (if different from baseurl, otherwise falls back to baseurl, e.g., Mercure is running on localhost during development)
# mercure.baseurl=http://localhost:3000
# Mercure hub URL path for SSE connection
mercure.hub.url=/.well-known/mercure
# Topic to subscribe for analysis requests
mercure.topic=/invasions/analysis-requests

# scenario.analysis.visits=100
scenario.analysis.visits=1000
# default komi used only when SGF has no KM and metadata doesn't override
scenario.komi=7.5
# minimum total moves before a path is allowed to end
scenario.min_moves=5
# minimum response policy threshold for human-like moves
scenario.min_response_policy=0.05
# include optimal moves in analysis results
scenario.include_optimal_moves=false
# minimum depth before endness checks can end a path
scenario.min_depth_for_endness=5
# score drop threshold for ending a path
scenario.score_drop_threshold=15.0
# endness value boundaries
scenario.max_endness=1.0
scenario.min_endness=-1.0
# target depth for endness calculation curve
scenario.depth_target_moves=30.0
# curve shape for depth factor: 1.0 = linear, >1.0 = slower early/faster late
scenario.depth_power=1.1
# number of recent moves to check for tenuki
scenario.tenuki_history_moves=3
# distance threshold for considering a move as tenuki
scenario.tenuki_distance_threshold=6.0
# maximum number of optimal moves to add from parent position
scenario.max_optimal_moves=1
# maximum candidates to check for sente moves
scenario.max_sente_candidates=5
# minimum policy for a sente move to be considered
scenario.min_sente_policy=0.05
# minimum urgency threshold to continue when no sente moves
scenario.min_urgency_to_continue=12.0
# when true, if no valid computer response exists inside allowed area, fallback may force choose one outside allowed area
scenario.allow_fallback_outside_area=false
# number of visits for analyzing pass move when calculating urgency
scenario.pass_move_visits=200
# ownership threshold for determining if human moves clearly belong to opponent
# note: higher-strength models produce clearer ownership predictions, so this threshold
# can be set higher when using stronger models
scenario.ownership_threshold=0.7
# max score drop from best move for max rank response candidates
scenario.max_score_drop_max_mode=0.5
# minimum visits for a max rank response candidate to be valid
scenario.min_response_visits_max_mode=50
# maximum depth to explore during precalculation
scenario.precalculation_max_depth=40
# maximum number of nodes to explore during precalculation
scenario.precalculation_max_nodes=1000
# submit analysis requests every N nodes during precalculation
scenario.precalculation_batch_size=10
# precalculation traversal strategy: bfs (breadth-first) or dfs (depth-first)
scenario.precalculation_strategy=dfs
# min policy threshold for exploring moves during precalculation
scenario.precalculation_min_policy=0.1
scenario.poll.interval.ms = 5000
